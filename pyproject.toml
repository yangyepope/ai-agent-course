[project]
name = "ai-agent-course"
version = "0.1.0"
description = "AI Agent 课程仓库（01 ~ 11 章共用一套依赖）"
requires-python = ">=3.13"

# 这里只列「直接依赖」——代码里 import 到的、或命令行直接调用的包。
# 传递依赖（annotated-types / httpx / tokenizers / scipy 等约 80 个）不写在这里，
# 由 uv.lock 精确锁定。要看完整的、钉死版本的清单，看 uv.lock 或 requirements.txt。
dependencies = [
    # ---- 01 章 Web 服务 ----
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    # ---- 01 ~ 05 章 LLM / LangChain / LangGraph ----
    "openai>=3.7.0",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    # ---- 06 ~ 07 章 向量 / 向量库 ----
    "numpy>=2.5.2",
    "faiss-cpu>=1.15.0",
    # ---- 09 章 PDF 加载（PyPDFLoader 的运行时依赖，不装会 ImportError）----
    "pypdf>=6.16.2",
    # ---- 10 ~ 11 章 稠密检索 / 混合检索 ----
    "sentence-transformers>=6.0.1",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    # torch 显式声明，是为了下面 tool.uv.sources 能把它钉到 CPU 索引上。
    # 否则 sentence-transformers 会从 PyPI 拉 GPU 版，多带进约 5GB 的 nvidia-* 轮子。
    # 钉死小版本：这是已验证过的 CPU 版，且是个 ~200MB 的大包，不随手升。
    "torch==2.13.0",
    # ---- Elasticsearch（生产级检索后端）----
    # 客户端大版本需与 ES 服务端对齐：当前本地服务端是 8.15.5（docker），
    # 客户端必须用 8.x（9.x 客户端发的 Accept 头声明 compatible-with=9，
    # 8.x 服务端会直接 400 拒绝，导致 ping() 返回 False）。
    "elasticsearch>=8.13,<9",
    "pytest>=9.1.1",
]

[dependency-groups]
# 开发期工具，不是运行时依赖。`uv sync` 默认会装；线上部署用 `uv sync --no-dev` 跳过。
dev = [
    "pyright>=1.1.411",
    # ruff 同时充当 linter 和 formatter，替掉了 flake8/black/isort 三个工具。
    # 装在这里是为了 CLI（uv run ruff）和 VSCode 的 ruff 扩展读同一份 [tool.ruff] 配置。
    "ruff>=0.15.0",
]

[tool.uv]
# 本仓库是一堆课程脚本，不是可安装的 Python 包 —— 不要试图 build/install 它自身。
package = false

# torch 的 CPU 版只存在于 PyTorch 官方索引，PyPI 上没有 +cpu 后缀的包。
# explicit = true 表示：只有在 tool.uv.sources 里显式指到它的包才走这个索引，
# 其余包一律走 PyPI。这样就不再需要 `--index-strategy unsafe-best-match`。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
# Ruff：本仓库唯一的 linter + formatter。
# 之所以要显式写死配置，而不是吃默认值：VSCode 的 ruff 扩展内置了自己的 ruff，
# 没有配置文件时它按默认规则跑，仓库里就没人管得住它报什么。写在这里，
# 编辑器和命令行读的是同一份规则。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
# E = pycodestyle 错误类
# F = pyflakes 真问题（未使用的 import、未定义的变量、重复定义）
# I = isort import 排序（保存时自动整理）
#
# 故意不启用的规则集，每条都有具体原因：
#   W  行尾空格 / 文件末尾换行。这类问题该由 formatter 和编辑器的
#      files.trimTrailingWhitespace 静默修掉，不该变成警告。关键在于
#      W291/W293 是「物理行」检查，会把三引号字符串「内部」的空格也一起报；
#      本仓库大量使用 """...""" 笔记块，实测全量格式化后仍残留 56 条
#      ruff 拒绝自动修复（改了就等于改你的字符串内容）的警告 —— 纯噪音，且永远修不掉。
#   UP pyupgrade，会不停要求改写本来能正常跑的代码，对课程仓库是纯噪音。
#   B  bugbear，其 B008 会把 FastAPI 的 Depends() 默认参数全部误报，01 章就在用。
select = ["E", "F", "I"]
ignore = [
    # 行宽：代码部分交给 formatter；长中文注释和文档字符串不该因此报警。
    "E501",
    # import 不在文件顶部：本仓库的课程脚本是「import → 演示 → import → 演示」
    # 分段排布的（见 03-langchain-tool/app/main.py），这是有意的教学结构。
    "E402",
]
